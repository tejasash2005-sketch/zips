version: '3.8'

services:
  backend:
    build:
      context: ./ai-life-os/ai-life-os-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=llama-3.3-70b-versatile
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}

  frontend:
    build:
      context: ./ai-life-os/ai-life-os-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
